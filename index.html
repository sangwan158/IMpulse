        ul { list-style: none; margin: 0; padding: 0; background: var(--card); border-radius: 8px; border: 1px solid var(--line); }
        li + li { border-top: 1px solid var(--line); }
        a { display: block; padding: 18px 20px; color: inherit; text-decoration: none; font-size: 17px; font-weight: 600; }
